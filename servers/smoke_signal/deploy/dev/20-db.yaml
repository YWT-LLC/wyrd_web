apiVersion: v1
kind: Pod

metadata:
  name: db
  labels:
    name: db
    app: smoke-signal-db

spec:
  containers:
  - name: db
    image: smoke-signal/db 
    imagePullPolicy: Never
    resources:
      limits:
        memory: "2Gi"
        cpu: "500m"
    ports:
      - containerPort: 5432

---
apiVersion: v1
kind: Service

metadata:
  name: db

spec:
  selector:
    app: smoke-signal-db
  type: LoadBalancer
  ports:
  - port: 5432
    targetPort: 5432
