name: wyrd_web
description: "Build communities on the Wyrd-Wide-Web. Free from the controlling hand of tech giants."
version: 1.0.1+2
publish_to: 'none'
repository: https://github.com/YWT-LLC/wyrd_web

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Flutter (Google)
  go_router: ^18.0.2
  intl: ^0.20.3
  shared_preferences: ^2.5.5

  # Community
  flutter_localized_locales: ^2.0.5
  provider: ^6.1.5+1

  # YWT
  ywt_private:
    path: ../ywt_private/
  open_ui:
    path: ../open_ui/

dev_dependencies:
  dependency_validator: ^5.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/web-of-wyrd.png

flutter_launcher_icons:
  image_path: assets/images/web-of-wyrd.png
  adaptive_icon_foreground: assets/images/web-of-wyrd.png
  adaptive_icon_background: "#F5F5F5"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true

flutter_native_splash:
  image: assets/images/web-of-wyrd.png
  color: "#F5F5F5"
  android: true
  ios: true
  web: true