name: wyrd_web
description: "Enter the wyrd web to build more Empathetech communities. Ones free from the controlling hand of tech giants."
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # Flutter (Google)
  go_router: ^14.2.7
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0

  # Community
  feedback: ^3.1.0
  flutter_localized_locales: ^2.0.5
  flutter_platform_widgets: ^7.0.1

  efui_bios:
    path: ../efui_bios/
  empathetech_flutter_ui:
    path: ../empathetech_flutter_ui/

dev_dependencies:
  dependency_validator: ^4.1.0
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  generate: true # For l10n
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/fonts/Roboto-Black.ttf
    - assets/fonts/Roboto-BlackItalic.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/fonts/Roboto-BoldItalic.ttf
    - assets/fonts/Roboto-Italic.ttf
    - assets/fonts/Roboto-Light.ttf
    - assets/fonts/Roboto-LightItalic.ttf
    - assets/fonts/Roboto-Medium.ttf
    - assets/fonts/Roboto-MediumItalic.ttf
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Thin.ttf
    - assets/fonts/Roboto-ThinItalic.ttf
    - assets/images/
    - assets/images/web-of-wyrd.png

flutter_launcher_icons:
  image_path: assets/images/web-of-wyrd.png
  adaptive_icon_foreground: assets/images/web-of-wyrd.png
  adaptive_icon_background: "#F5F5F5"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true

flutter_native_splash:
  color: "#F5F5F5"
  image: assets/images/web-of-wyrd.png
  android: true
  ios: true
  web: true