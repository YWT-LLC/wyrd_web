name: wyrd_web
description: "Enter the wyrd web to build more Empathetech communities. Ones free from the controlling hand of tech giants."
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Flutter (Google)
  go_router: ^14.0.1
  shared_preferences: ^2.2.1
  url_launcher: ^6.1.14

  # Community
  feedback: ^3.0.1
  flutter_localized_locales: ^2.0.5
  flutter_platform_widgets: ^7.0.0

  # Empathetech
  efui_bios:
    path: ../efui_bios/
  empathetech_flutter_ui:
    path: ../empathetech_flutter_ui/

dev_dependencies:
  dependency_validator: ^4.1.0
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  generate: true # For l10n
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/fonts/Roboto-Black.ttf
    - assets/fonts/Roboto-BlackItalic.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/fonts/Roboto-BoldItalic.ttf
    - assets/fonts/Roboto-Italic.ttf
    - assets/fonts/Roboto-Light.ttf
    - assets/fonts/Roboto-LightItalic.ttf
    - assets/fonts/Roboto-Medium.ttf
    - assets/fonts/Roboto-MediumItalic.ttf
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Thin.ttf
    - assets/fonts/Roboto-ThinItalic.ttf
    - assets/images/
